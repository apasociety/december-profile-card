<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ডিসেম্বর প্রোফাইল ফটোকার্ড</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans Bengali',sans-serif;background:linear-gradient(145deg,#f1fff4,#fff0f0);color:#193124}.wrap{max-width:760px;margin:auto;padding:20px 14px 45px}h1{text-align:center;font-size:clamp(22px,4vw,32px);margin:10px 0 5px}p{text-align:center;color:#53645b;margin:0 0 18px}.preview{background:white;border-radius:18px;padding:10px;box-shadow:0 10px 40px #153b2620}canvas{width:100%;height:auto;display:block;touch-action:none;cursor:grab}.controls{background:white;border-radius:16px;padding:18px;margin-top:18px;box-shadow:0 6px 24px #153b2610}.buttons{display:flex;gap:10px;flex-wrap:wrap}button,.upload{border:0;border-radius:10px;background:#006b3a;color:white;font-weight:700;padding:12px 17px;cursor:pointer;font-size:15px}.upload{display:inline-block;background:#b30b19}button.secondary{background:#e7eee9;color:#193124}button.download{background:#c4091c;flex:1}input[type=file]{display:none}label.range{display:flex;justify-content:space-between;margin-top:18px;font-weight:600}input[type=range]{width:100%;accent-color:#c4091c}small{display:block;text-align:center;margin-top:16px;color:#61746a}</style></head><body><main class="wrap"><h1>ডিসেম্বর প্রোফাইল ফটোকার্ড</h1><p>নিজের ছবি যোগ করুন, সাজিয়ে নিন এবং ডাউনলোড করুন</p><section class="preview"><canvas id="card" width="1280" height="1229" aria-label="ফটোকার্ড প্রিভিউ"></canvas></section><section class="controls"><div class="buttons"><label class="upload" for="file">📷 ছবি আপলোড / পরিবর্তন</label><input id="file" type="file" accept="image/*"><button id="reset" class="secondary">↺ ছবি রিসেট</button><button id="download" class="download">⬇ PNG ডাউনলোড</button></div><label class="range" for="zoom">ছবি জুম <output id="zoomValue">100%</output></label><input id="zoom" type="range" min="100" max="300" value="100"><label class="range" for="brightness">উজ্জ্বলতা <output id="brightnessValue">100%</output></label><input id="brightness" type="range" min="60" max="150" value="100"><small>ছবির উপর মাউস বা আঙুল দিয়ে টেনে অবস্থান পরিবর্তন করুন। আপলোড করা ছবি আপনার ডিভাইসেই থাকে।</small></section></main><script>
const canvas=document.getElementById('card'),ctx=canvas.getContext('2d');const frame=new Image();frame.src='assets/frame.png';let photo=null,zoom=1,brightness=1,offsetX=0,offsetY=0;const circle={x:632,y:632,r:309};
function render(){ctx.clearRect(0,0,1280,1229);if(frame.complete&&frame.naturalWidth)ctx.drawImage(frame,0,0,1280,1229);else{ctx.fillStyle='#b30b19';ctx.fillRect(0,0,1280,1229)}if(photo){ctx.save();ctx.beginPath();ctx.arc(circle.x,circle.y,circle.r,0,Math.PI*2);ctx.clip();ctx.fillStyle='#fff';ctx.fillRect(circle.x-circle.r,circle.y-circle.r,circle.r*2,circle.r*2);let scale=Math.max(circle.r*2/photo.width,circle.r*2/photo.height)*zoom,w=photo.width*scale,h=photo.height*scale;ctx.filter=`brightness(${brightness})`;ctx.drawImage(photo,circle.x-w/2+offsetX,circle.y-h/2+offsetY,w,h);ctx.filter='none';ctx.restore()}}
frame.onload=render;frame.onerror=()=>alert('assets/frame.png ফাইলটি পাওয়া যায়নি।');render();
document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('একটি ছবি নির্বাচন করুন');let url=URL.createObjectURL(f),img=new Image();img.onload=()=>{photo=img;offsetX=offsetY=0;zoom=brightness=1;document.getElementById('zoom').value=100;document.getElementById('brightness').value=100;document.getElementById('zoomValue').textContent='100%';document.getElementById('brightnessValue').textContent='100%';render();URL.revokeObjectURL(url)};img.onerror=()=>{alert('ছবি খোলা যায়নি');URL.revokeObjectURL(url)};img.src=url};
document.getElementById('zoom').oninput=e=>{zoom=+e.target.value/100;document.getElementById('zoomValue').textContent=e.target.value+'%';render()};document.getElementById('brightness').oninput=e=>{brightness=+e.target.value/100;document.getElementById('brightnessValue').textContent=e.target.value+'%';render()};document.getElementById('reset').onclick=()=>{offsetX=offsetY=0;zoom=brightness=1;document.getElementById('zoom').value=100;document.getElementById('brightness').value=100;document.getElementById('zoomValue').textContent='100%';document.getElementById('brightnessValue').textContent='100%';render()};
let dragging=false,lastX=0,lastY=0;canvas.addEventListener('pointerdown',e=>{if(!photo)return;dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!dragging)return;let rect=canvas.getBoundingClientRect(),s=1280/rect.width;offsetX+=(e.clientX-lastX)*s;offsetY+=(e.clientY-lastY)*s;lastX=e.clientX;lastY=e.clientY;render()});['pointerup','pointercancel','lostpointercapture'].forEach(name=>canvas.addEventListener(name,()=>dragging=false));document.getElementById('download').onclick=()=>{if(!photo)return alert('প্রথমে নিজের ছবি আপলোড করুন।');render();canvas.toBlob(blob=>{if(!blob)return alert('ডাউনলোড করা যায়নি');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='december-profile-card.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')};
</script></body></html>
