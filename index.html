<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ডিসেম্বর প্রোফাইল কার্ড</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f5;color:#242424;font-family:'Hind Siliguri',sans-serif}.wrap{max-width:680px;margin:25px auto;padding:0 14px}h1{font-size:27px;text-align:center;margin:0 0 6px}.hint{text-align:center;color:#666;margin:0 0 18px}.panel{background:white;border-radius:20px;padding:16px;box-shadow:0 8px 30px #0001}canvas{width:100%;height:auto;display:block;border-radius:12px;touch-action:none;background:#b90911}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}.btn{font:700 16px 'Hind Siliguri',sans-serif;border:0;border-radius:11px;background:#bb0712;color:white;padding:10px 16px;cursor:pointer;display:inline-block;text-align:center}.btn.secondary{background:#30333b}.btn.light{background:#f0e9e9;color:#5b1010}input[type=file]{display:none}.range{width:100%;display:flex;gap:10px;align-items:center;margin-top:14px}.range input{flex:1;min-width:0}.footer{font-size:13px;color:#666;text-align:center;margin:12px 0 20px}</style></head><body><main class="wrap"><h1>ডিসেম্বর প্রোফাইল কার্ড</h1><p class="hint">নিজের ছবি বসিয়ে কার্ড ডাউনলোড করুন</p><div class="panel"><canvas id="card" width="1080" height="1080" aria-label="কার্ডের লাইভ প্রিভিউ"></canvas><div class="controls"><label class="btn" for="upload">📷 ছবি আপলোড / পরিবর্তন</label><input id="upload" type="file" accept="image/*"><button class="btn secondary" id="reset">ছবি রিসেট</button><button class="btn light" id="minus">− ছোট</button><button class="btn light" id="plus">+ বড়</button><button class="btn" id="download">⬇ PNG ডাউনলোড</button></div><div class="range"><label for="zoom">জুম</label><input id="zoom" type="range" min="1" max="3" value="1" step="0.01"></div><div class="range"><label for="brightness">উজ্জ্বলতা</label><input id="brightness" type="range" min="60" max="150" value="100"></div><p class="footer">ছবি টেনে সরিয়ে গোলাকার ফ্রেমে ঠিক করুন। আপনার ছবি সার্ভারে আপলোড হয় না।</p></div></main><script>
const canvas=document.getElementById('card'),ctx=canvas.getContext('2d'),zoom=document.getElementById('zoom'),brightness=document.getElementById('brightness');const W=1080,H=1080;let photo=null,scale=1,dx=0,dy=0,drag=null;const hero=new Image();hero.src='assets/PM Madem.png';hero.onload=draw;document.fonts.ready.then(draw);
function draw(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#7d030b');bg.addColorStop(.48,'#c30713');bg.addColorStop(1,'#e11a20');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
// geometric red shapes
ctx.save();ctx.globalAlpha=.21;ctx.fillStyle='#4a0008';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(420,0);ctx.lineTo(0,600);ctx.fill();ctx.beginPath();ctx.moveTo(680,0);ctx.lineTo(930,0);ctx.lineTo(670,420);ctx.fill();ctx.fillStyle='#ff5960';ctx.beginPath();ctx.moveTo(1080,160);ctx.lineTo(1080,760);ctx.lineTo(720,570);ctx.fill();ctx.restore();
// faint crowd silhouettes
ctx.save();ctx.fillStyle='rgba(65,0,8,.30)';for(let i=0;i<17;i++){let x=i*74-24,y=860+(i%4)*24;ctx.beginPath();ctx.arc(x,y,26+(i%3)*7,0,Math.PI*2);ctx.fill();ctx.fillRect(x-22,y+15,50,190)}ctx.restore();
// central white photo circle
const cx=540,cy=460,r=407;ctx.beginPath();ctx.arc(cx,cy,r+19,0,Math.PI*2);ctx.fillStyle='#aa000b';ctx.fill();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();if(photo){const base=Math.max(2*r/photo.width,2*r/photo.height);let ww=photo.width*base*scale,hh=photo.height*base*scale;ctx.filter=`brightness(${brightness.value}%)`;ctx.drawImage(photo,cx-ww/2+dx,cy-hh/2+dy,ww,hh);ctx.filter='none'}else{ctx.fillStyle='#aaa';ctx.textAlign='center';ctx.font='700 32px "Hind Siliguri",sans-serif';ctx.fillText('এখানে আপনার ছবি দিন',cx,cy)}ctx.restore();
// fixed leader image overlays bottom of circle
if(hero.complete&&hero.naturalWidth){const ratio=hero.naturalWidth/hero.naturalHeight;let hh=570,ww=hh*ratio;ctx.drawImage(hero,(W-ww)/2,490,ww,hh)}
// fixed red title plate
ctx.fillStyle='#b90812';roundRect(ctx,275,907,530,155,58);ctx.fill();ctx.textAlign='center';ctx.fillStyle='#fff';ctx.shadowColor='#530007';ctx.shadowBlur=5;ctx.font='800 57px "Hind Siliguri",sans-serif';ctx.fillText('অপেক্ষার নাম',540,971);ctx.font='800 59px "Hind Siliguri",sans-serif';ctx.fillText('শেখ হাসিনা',540,1033);ctx.shadowBlur=0}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function load(f){if(!f||!f.type.startsWith('image/'))return;let u=URL.createObjectURL(f),im=new Image();im.onload=()=>{photo=im;scale=1;dx=dy=0;zoom.value=1;brightness.value=100;URL.revokeObjectURL(u);draw()};im.src=u}document.getElementById('upload').onchange=e=>load(e.target.files[0]);zoom.oninput=()=>{scale=+zoom.value;draw()};brightness.oninput=draw;document.getElementById('plus').onclick=()=>{scale=Math.min(3,scale+.1);zoom.value=scale;draw()};document.getElementById('minus').onclick=()=>{scale=Math.max(1,scale-.1);zoom.value=scale;draw()};document.getElementById('reset').onclick=()=>{scale=1;dx=dy=0;zoom.value=1;brightness.value=100;draw()};
canvas.addEventListener('pointerdown',e=>{if(!photo)return;drag={x:e.clientX,y:e.clientY,dx,dy};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;let rect=canvas.getBoundingClientRect(),factor=W/rect.width;dx=drag.dx+(e.clientX-drag.x)*factor;dy=drag.dy+(e.clientY-drag.y)*factor;draw()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);document.getElementById('download').onclick=()=>{draw();let a=document.createElement('a');a.download='december-profile-card.png';a.href=canvas.toDataURL('image/png');a.click()};draw();
</script></body></html>
