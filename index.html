<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ডিসেম্বর প্রোফাইল কার্ড</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f1f1;font-family:system-ui,'Noto Sans Bengali',sans-serif;color:#331016}.wrap{max-width:720px;margin:auto;padding:20px 12px 45px}h1{text-align:center;font-size:clamp(22px,4vw,32px);margin:10px 0}p{text-align:center;color:#76585d}.preview{padding:8px;background:white;border-radius:16px;box-shadow:0 8px 30px #51001025}canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab}.controls{margin-top:16px;padding:18px;background:white;border-radius:16px;box-shadow:0 4px 20px #51001016}.buttons{display:flex;flex-wrap:wrap;gap:9px}.upload,button{border:0;border-radius:10px;background:#b80d23;color:white;padding:12px 15px;font-size:15px;font-weight:700;cursor:pointer}.upload{display:inline-block}button.secondary{background:#eee5e5;color:#3e2424}button.download{flex:1;background:#087044}input[type=file]{display:none}.slider{display:flex;justify-content:space-between;margin-top:15px;font-weight:600}input[type=range]{width:100%;accent-color:#c40d25}small{display:block;margin-top:14px;text-align:center;color:#75646a}</style></head><body><main class="wrap"><h1>ডিসেম্বর প্রোফাইল ফটোকার্ড</h1><p>নিজের ছবি আপলোড করে কার্ড তৈরি করুন</p><section class="preview"><canvas id="card" width="1280" height="1280"></canvas></section><section class="controls"><div class="buttons"><label class="upload" for="file">📷 ছবি আপলোড / পরিবর্তন</label><input type="file" id="file" accept="image/*"><button class="secondary" id="reset">↺ রিসেট</button><button class="download" id="download">⬇ PNG ডাউনলোড</button></div><label class="slider" for="zoom">জুম <output id="zv">100%</output></label><input id="zoom" type="range" min="100" max="300" value="100"><label class="slider" for="brightness">উজ্জ্বলতা <output id="bv">100%</output></label><input id="brightness" type="range" min="60" max="150" value="100"><small>ছবি টেনে অবস্থান পরিবর্তন করুন। আপনার আপলোড করা ছবি সার্ভারে পাঠানো হয় না।</small></section></main><script>
const canvas=document.getElementById('card'),ctx=canvas.getContext('2d');const frame=new Image();frame.src='assets/frame.jpg';let photo=null,zoom=1,brightness=1,ox=0,oy=0;const c={x:640,y:696,r:321};function render(){ctx.clearRect(0,0,1280,1280);if(frame.complete&&frame.naturalWidth)ctx.drawImage(frame,0,0,1280,1280);else{ctx.fillStyle='#a40b20';ctx.fillRect(0,0,1280,1280)}if(photo){ctx.save();ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.clip();let s=Math.max(c.r*2/photo.width,c.r*2/photo.height)*zoom,w=photo.width*s,h=photo.height*s;ctx.filter=`brightness(${brightness})`;ctx.drawImage(photo,c.x-w/2+ox,c.y-h/2+oy,w,h);ctx.filter='none';ctx.restore();ctx.beginPath();ctx.arc(c.x,c.y,c.r+5,0,Math.PI*2);ctx.strokeStyle='#ffe5a0';ctx.lineWidth=11;ctx.stroke()}}
frame.onload=render;render();const file=document.getElementById('file');file.onchange=e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('ছবি নির্বাচন করুন');const url=URL.createObjectURL(f),img=new Image();img.onload=()=>{photo=img;URL.revokeObjectURL(url);reset()};img.onerror=()=>{URL.revokeObjectURL(url);alert('ছবি খোলা যায়নি')};img.src=url};function reset(){zoom=brightness=1;ox=oy=0;document.getElementById('zoom').value=100;document.getElementById('brightness').value=100;document.getElementById('zv').textContent='100%';document.getElementById('bv').textContent='100%';render()}document.getElementById('reset').onclick=reset;document.getElementById('zoom').oninput=e=>{zoom=e.target.value/100;document.getElementById('zv').textContent=e.target.value+'%';render()};document.getElementById('brightness').oninput=e=>{brightness=e.target.value/100;document.getElementById('bv').textContent=e.target.value+'%';render()};let drag=false,lx=0,ly=0;canvas.onpointerdown=e=>{if(!photo)return;drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;const scale=1280/canvas.getBoundingClientRect().width;ox+=(e.clientX-lx)*scale;oy+=(e.clientY-ly)*scale;lx=e.clientX;ly=e.clientY;render()};['pointerup','pointercancel','lostpointercapture'].forEach(k=>canvas.addEventListener(k,()=>drag=false));document.getElementById('download').onclick=()=>{if(!photo)return alert('প্রথমে ছবি আপলোড করুন');render();canvas.toBlob(blob=>{if(!blob)return;let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='december-profile-card.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)},'image/png')};
</script></body></html>
