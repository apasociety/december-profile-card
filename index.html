<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ডিসেম্বর প্রোফাইল কার্ড</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#fff3f3;color:#292020;font-family:'Hind Siliguri',sans-serif}.wrap{max-width:700px;margin:auto;padding:20px 14px 35px}h1{text-align:center;color:#9e0712;font-size:27px;margin:0 0 6px}p{text-align:center;margin:0 0 14px;color:#655}canvas{width:100%;display:block;border-radius:14px;box-shadow:0 12px 35px #5c101027;touch-action:none;background:#ae0715}.panel{margin-top:18px;background:white;border-radius:15px;padding:18px;box-shadow:0 5px 20px #70000014}.buttons{display:flex;gap:9px;flex-wrap:wrap}button,.upload{background:#bb0719;color:white;border:0;border-radius:10px;padding:12px 16px;font:700 16px 'Hind Siliguri',sans-serif;cursor:pointer;display:inline-block}button.secondary{background:#274d39}button:disabled{opacity:.5;cursor:not-allowed}input[type=file]{display:none}.control{display:flex;align-items:center;gap:12px;margin-top:12px}.control label{min-width:88px}input[type=range]{flex:1;accent-color:#bc0617}.hint{font-size:14px;color:#766;margin-top:10px;text-align:left}@media(max-width:500px){h1{font-size:23px}.buttons>*{flex:1;text-align:center}}</style></head><body><main class="wrap"><h1>ডিসেম্বর প্রোফাইল কার্ড</h1><p>নিজের ছবি যুক্ত করে কার্ডটি ডাউনলোড করুন</p><canvas id="card" width="1080" height="1080" aria-label="ফটোকার্ড প্রিভিউ"></canvas><section class="panel"><div class="buttons"><label class="upload" for="photo">ছবি আপলোড / পরিবর্তন</label><input type="file" id="photo" accept="image/*"><button id="reset" class="secondary">ছবি রিসেট</button><button id="download">PNG ডাউনলোড</button></div><div class="control"><label for="zoom">জুম</label><input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></div><div class="control"><label for="bright">উজ্জ্বলতা</label><input id="bright" type="range" min="60" max="150" value="100"></div><p class="hint">ছবি আপলোডের পর গোলাকার ফ্রেমের মধ্যে আঙুল বা মাউস দিয়ে টেনে অবস্থান পরিবর্তন করুন। ফ্রেম, লেখা ও নেতাদের ছবি স্থায়ী। যশোর জেলার জন্য উন্মুক্ত। </p></section></main><script>
const c=document.getElementById('card'),ctx=c.getContext('2d');const photoInput=document.getElementById('photo'),zoom=document.getElementById('zoom'),bright=document.getElementById('bright');let user=null,ox=0,oy=0,drag=false,lastX=0,lastY=0;const left=new Image(),right=new Image();left.src='assets/left.png';right.src='assets/right.png';left.onload=draw;right.onload=draw;document.fonts.ready.then(draw);
function text(t,x,y,size,color='#fff',align='center'){ctx.save();ctx.font=`800 ${size}px "Hind Siliguri",sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.shadowColor='#510000';ctx.shadowBlur=9;ctx.fillStyle=color;ctx.fillText(t,x,y);ctx.restore()}
function cover(img,x,y,w,h){let scale=Math.max(w/img.width,h/img.height);ctx.drawImage(img,x+(w-img.width*scale)/2,y+(h-img.height*scale)/2,img.width*scale,img.height*scale)}
function draw(){const w=1080,h=1080;ctx.clearRect(0,0,w,h);let g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#74000b');g.addColorStop(.42,'#d60b20');g.addColorStop(1,'#8e0010');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
// coded decorative background
ctx.save();ctx.globalAlpha=.12;for(let i=0;i<15;i++){ctx.fillStyle=i%2?'#fff':'#440000';ctx.beginPath();ctx.moveTo(540,500);let a=i*Math.PI/7.5;ctx.lineTo(540+1300*Math.cos(a),500+1300*Math.sin(a));ctx.lineTo(540+1300*Math.cos(a+.14),500+1300*Math.sin(a+.14));ctx.fill()}ctx.restore();
ctx.strokeStyle='#ffdfd5';ctx.lineWidth=11;ctx.strokeRect(19,19,1042,1042);ctx.strokeStyle='#74000a';ctx.lineWidth=12;ctx.strokeRect(34,34,1012,1012);
// corner images (the only fixed image assets)
if(left.complete&&left.naturalWidth){ctx.save();ctx.shadowColor='#420000';ctx.shadowBlur=18;ctx.drawImage(left,48,74,285,260);ctx.restore()}
if(right.complete&&right.naturalWidth){ctx.save();ctx.beginPath();ctx.arc(893,207,158,0,Math.PI*2);ctx.clip();cover(right,735,49,316,316);ctx.restore();ctx.beginPath();ctx.arc(893,207,158,0,Math.PI*2);ctx.lineWidth=11;ctx.strokeStyle='#fff';ctx.stroke();ctx.beginPath();ctx.arc(893,207,165,0,Math.PI*2);ctx.lineWidth=8;ctx.strokeStyle='#fbd18a';ctx.stroke()}
// top headline
ctx.fillStyle='#74000b';ctx.beginPath();ctx.roundRect(345,80,375,182,24);ctx.fill();text('জয় বাংলা',530,134,56);text('জয় বঙ্গবন্ধু',530,207,48,'#ffe79a');
// center profile circle
const cx=540,cy=610,r=290;ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();ctx.fillStyle='#fff';ctx.fillRect(cx-r,cy-r,2*r,2*r);if(user){let base=Math.max(2*r/user.width,2*r/user.height)*Number(zoom.value);let iw=user.width*base,ih=user.height*base;ctx.filter=`brightness(${bright.value}%)`;ctx.drawImage(user,cx-iw/2+ox,cy-ih/2+oy,iw,ih);ctx.filter='none'}else{text('এখানে নিজের ছবি দিন',cx,cy,36,'#a8091b')}ctx.restore();ctx.beginPath();ctx.arc(cx,cy,r+8,0,Math.PI*2);ctx.lineWidth=20;ctx.strokeStyle='#fff';ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,r+20,0,Math.PI*2);ctx.lineWidth=13;ctx.strokeStyle='#ffbf56';ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,r+30,0,Math.PI*2);ctx.lineWidth=8;ctx.strokeStyle='#9c0013';ctx.stroke();
// bottom red slogan ribbon, rendered entirely with code
let bar=ctx.createLinearGradient(0,916,0,1050);bar.addColorStop(0,'#75000b');bar.addColorStop(1,'#d40719');ctx.fillStyle=bar;ctx.beginPath();ctx.roundRect(165,925,750,126,28);ctx.fill();ctx.strokeStyle='#ffd3b2';ctx.lineWidth=4;ctx.stroke();text('অপেক্ষার নাম — শেখ হাসিনা',540,989,60);
}
photoInput.addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{user=img;ox=oy=0;zoom.value=1;bright.value=100;draw();URL.revokeObjectURL(url)};img.src=url});zoom.oninput=bright.oninput=draw;document.getElementById('reset').onclick=()=>{ox=oy=0;zoom.value=1;bright.value=100;draw()};function pt(e){const rect=c.getBoundingClientRect();return {x:(e.clientX-rect.left)*1080/rect.width,y:(e.clientY-rect.top)*1080/rect.height}}c.addEventListener('pointerdown',e=>{if(!user)return;let p=pt(e);if(Math.hypot(p.x-540,p.y-610)>290)return;drag=true;lastX=p.x;lastY=p.y;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;let p=pt(e);ox+=p.x-lastX;oy+=p.y-lastY;lastX=p.x;lastY=p.y;draw()});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);document.getElementById('download').onclick=()=>{draw();c.toBlob(blob=>{if(!blob)return;const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='december-profile-card.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')};draw();
</script></body></html>
