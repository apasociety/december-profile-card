<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ডিসেম্বর প্রোফাইল ফটোকার্ড</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{font-family:'Hind Siliguri',system-ui,sans-serif;color:#f8fafc;background:#0d101a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#361522,#0d101a 70%);min-height:100vh}.wrap{max-width:1140px;margin:auto;padding:32px 16px 70px}h1{font-size:clamp(24px,4vw,38px);margin:0;text-align:center}p.sub{text-align:center;color:#cbd5e1;margin:5px 0 24px}.layout{display:grid;grid-template-columns:minmax(0,660px) minmax(260px,1fr);gap:25px;align-items:start}.preview{background:#181c29;border:1px solid #3b4050;border-radius:22px;padding:12px;box-shadow:0 18px 60px #0006}canvas{display:block;width:100%;height:auto;border-radius:14px;touch-action:none;cursor:grab}.panel{border:1px solid #3b4050;background:#1b2030;border-radius:20px;padding:22px;display:grid;gap:17px}.panel h2{margin:0;font-size:23px}.hint{color:#aeb7ca;font-size:14px;line-height:1.5}.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 15px;cursor:pointer;text-align:center;display:block;width:100%;background:#e11d35;color:white}.btn.secondary{background:#333c50}.btn:focus-visible,input:focus-visible{outline:3px solid #ffb0ba;outline-offset:2px}.field{display:grid;gap:7px;font-weight:600}.field input[type=range]{width:100%;accent-color:#e11d35}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons .btn{font-size:14px;padding:10px}.file{display:none}.status{min-height:18px;font-size:13px;color:#cbd5e1}.footer{text-align:center;color:#9ca3af;font-size:13px;margin-top:22px}@media(max-width:900px){.layout{grid-template-columns:1fr}.preview{max-width:660px;margin:auto}.panel{max-width:660px;width:100%;margin:auto}}
</style></head><body><main class="wrap"><h1>ডিসেম্বর প্রোফাইল ফটোকার্ড</h1><p class="sub">নিজের ছবি যোগ করুন, সাজিয়ে নিন, ডাউনলোড করুন</p><div class="layout"><section class="preview" aria-label="ফটোকার্ড প্রিভিউ"><canvas id="card" width="1080" height="1080"></canvas></section><section class="panel"><h2>আপনার ছবি তৈরি করুন</h2><label class="btn" for="photo">📷 ছবি আপলোড / পরিবর্তন</label><input class="file" id="photo" type="file" accept="image/*"><span class="hint">মাঝের গোল ফ্রেমে আপনার ছবি বসবে। ছবি টেনে অবস্থান পরিবর্তন করুন। দুই পাশের নেতৃবৃন্দের ছবি স্থায়ী।</span><label class="field">ছবি বড় / ছোট করুন<input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></label><label class="field">উজ্জ্বলতা<input id="bright" type="range" min="50" max="150" value="100"></label><label class="field">কনট্রাস্ট<input id="contrast" type="range" min="50" max="150" value="100"></label><div class="buttons"><button class="btn secondary" id="reset" type="button">↺ রিসেট / ক্রপ</button><button class="btn secondary" id="center" type="button">⊕ ছবি মাঝখানে</button></div><button class="btn" id="download" type="button">⬇ PNG ডাউনলোড</button><div class="status" id="status" role="status"></div></section></div><p class="footer">এই ওয়েবসাইটে আপলোড করা ছবি আপনার ব্রাউজারেই থাকে; কোনো সার্ভারে পাঠানো হয় না।</p></main><script>
const canvas=document.getElementById('card'),ctx=canvas.getContext('2d'),photoInput=document.getElementById('photo'),zoom=document.getElementById('zoom'),bright=document.getElementById('bright'),contrast=document.getElementById('contrast'),status=document.getElementById('status');let user=null,scale=1,offsetX=0,offsetY=0,drag=null;const imgs={};const center={x:540,y:560,r:275};function load(name,path){const im=new Image();im.onload=()=>{imgs[name]=im;draw()};im.onerror=()=>{status.textContent='ডিজাইনের ছবি পাওয়া যায়নি: '+path};im.src=path}load('left','assets/left-leaders.png');load('right','assets/right-leaders.png');function cover(im,x,y,w,h){const k=Math.max(w/im.width,h/im.height);ctx.drawImage(im,x+(w-im.width*k)/2,y+(h-im.height*k)/2,im.width*k,im.height*k)}function text(t,x,y,size,weight=800){ctx.font=`${weight} ${size}px 'Hind Siliguri',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y)}function draw(){ctx.clearRect(0,0,1080,1080);let bg=ctx.createLinearGradient(0,0,1080,1080);bg.addColorStop(0,'#79050b');bg.addColorStop(.55,'#ba0715');bg.addColorStop(1,'#e01822');ctx.fillStyle=bg;ctx.fillRect(0,0,1080,1080);ctx.globalAlpha=.16;ctx.fillStyle='#ff8d8d';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(800,0);ctx.lineTo(250,680);ctx.closePath();ctx.fill();ctx.fillStyle='#440006';ctx.beginPath();ctx.moveTo(1080,50);ctx.lineTo(1080,880);ctx.lineTo(660,0);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
// Fixed portraits at opposite upper corners
if(imgs.left){ctx.save();ctx.shadowColor='#0008';ctx.shadowBlur=18;ctx.drawImage(imgs.left,22,22,280,269);ctx.restore()}if(imgs.right){ctx.save();ctx.shadowColor='#0007';ctx.shadowBlur=16;const im=imgs.right;const h=325,w=h*im.width/im.height;ctx.drawImage(im,1080-28-w,12,w,h);ctx.restore()}
ctx.fillStyle='#9b0712';ctx.beginPath();ctx.arc(center.x,center.y,center.r+23,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(center.x,center.y,center.r+9,0,Math.PI*2);ctx.fill();ctx.save();ctx.beginPath();ctx.arc(center.x,center.y,center.r,0,Math.PI*2);ctx.clip();ctx.fillStyle='#f3f3f3';ctx.fillRect(center.x-center.r,center.y-center.r,center.r*2,center.r*2);if(user){ctx.filter=`brightness(${bright.value}%) contrast(${contrast.value}%)`;const k=Math.max(2*center.r/user.width,2*center.r/user.height)*scale;ctx.drawImage(user,center.x-user.width*k/2+offsetX,center.y-user.height*k/2+offsetY,user.width*k,user.height*k);ctx.filter='none'}else{ctx.fillStyle='#b7b7b7';ctx.beginPath();ctx.arc(540,500,87,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(540,740,200,148,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#666';text('আপনার ছবি দিন',540,820,30,700)}ctx.restore();
ctx.fillStyle='#85010d';ctx.beginPath();ctx.roundRect(110,905,860,135,36);ctx.fill();ctx.strokeStyle='#fbb6bb';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';text('অপেক্ষার নাম — শেখ হাসিনা',540,973,67);}
function loadUser(file){if(!file)return;if(!file.type.startsWith('image/')){status.textContent='একটি ছবি নির্বাচন করুন';return}const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{user=im;scale=1;offsetX=0;offsetY=0;zoom.value=1;bright.value=100;contrast.value=100;draw();URL.revokeObjectURL(url);status.textContent='ছবি যোগ হয়েছে। চাইলে টেনে অবস্থান ঠিক করুন।'};im.onerror=()=>{URL.revokeObjectURL(url);status.textContent='ছবি খোলা যায়নি'};im.src=url}photoInput.addEventListener('change',e=>loadUser(e.target.files[0]));zoom.oninput=()=>{scale=+zoom.value;draw()};bright.oninput=draw;contrast.oninput=draw;document.getElementById('reset').onclick=()=>{scale=1;offsetX=0;offsetY=0;zoom.value=1;bright.value=100;contrast.value=100;draw()};document.getElementById('center').onclick=()=>{offsetX=0;offsetY=0;draw()};function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*1080/r.width,y:(e.clientY-r.top)*1080/r.height}}canvas.addEventListener('pointerdown',e=>{if(!user)return;const p=pos(e);if(Math.hypot(p.x-center.x,p.y-center.y)>center.r)return;drag=p;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;const p=pos(e);offsetX+=p.x-drag.x;offsetY+=p.y-drag.y;drag=p;draw()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);document.getElementById('download').onclick=()=>{if(!user){status.textContent='আগে নিজের ছবি আপলোড করুন।';return}draw();canvas.toBlob(blob=>{if(!blob){status.textContent='ডাউনলোড তৈরি হয়নি';return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='december-profile-card.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);status.textContent='PNG ডাউনলোড শুরু হয়েছে।'},'image/png')};if(document.fonts)document.fonts.ready.then(draw);draw();
</script></body></html>
